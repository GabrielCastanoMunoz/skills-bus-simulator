<script>
const $=id=>document.getElementById(id);$('startTest').onclick=()=>{document.body.classList.add('testing');syncLowAirAlarm();window.scrollTo({top:0,behavior:'smooth'})};$('backCockpit').onclick=()=>{document.body.classList.remove('testing');syncLowAirAlarm();window.scrollTo({top:0,behavior:'smooth'})};let pressure=90,engine=false,parking=true,service=false,compressorOn=false;const engineSoundFile='lesiakower-diesel-engine-idle-bus-engine-idling-408780.mp3';const engineTracks=[new Audio(engineSoundFile),new Audio(engineSoundFile)];engineTracks.forEach(a=>{a.loop=false;a.preload='auto';a.volume=0;});const engineVolume=.32,engineOverlap=1.15;let activeEngineTrack=0,engineCrossfade=null;function stopEngineAudio(){if(engineCrossfade){clearInterval(engineCrossfade);engineCrossfade=null;}engineTracks.forEach(a=>{a.pause();a.currentTime=0;a.volume=0;});activeEngineTrack=0;}function startEngineAudio(){const a=engineTracks[activeEngineTrack];if(!a.paused)return;a.volume=engineVolume;a.play().catch(()=>{});}function monitorEngineLoop(){if(!engine||!soundEnabled||engineCrossfade)return;const a=engineTracks[activeEngineTrack];if(a.paused)return;const remaining=a.duration-a.currentTime;if(!Number.isFinite(remaining)||remaining>engineOverlap)return;const nextIndex=1-activeEngineTrack,b=engineTracks[nextIndex];b.pause();b.currentTime=0;b.volume=0;const overlap=Math.max(.25,Math.min(engineOverlap,remaining));b.play().then(()=>{const start=performance.now();engineCrossfade=setInterval(()=>{if(!engine||!soundEnabled){stopEngineAudio();return;}const t=Math.min(1,(performance.now()-start)/(overlap*1000));a.volume=engineVolume*Math.cos(t*Math.PI/2);b.volume=engineVolume*Math.sin(t*Math.PI/2);if(t>=1){clearInterval(engineCrossfade);engineCrossfade=null;a.pause();a.currentTime=0;a.volume=0;activeEngineTrack=nextIndex;}},35);}).catch(()=>{});}setInterval(monitorEngineLoop,75);let governorAudioContext=null;function unlockGovernorAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!governorAudioContext)governorAudioContext=new AC();if(governorAudioContext.state==='suspended')governorAudioContext.resume().catch(()=>{});}catch(e){}}function playGovernorPurge(){if(!soundEnabled)return;unlockGovernorAudio();const ctx=governorAudioContext;if(!ctx)return;const run=()=>{if(!soundEnabled)return;try{const duration=1.8,rate=ctx.sampleRate,buffer=ctx.createBuffer(1,Math.floor(rate*duration),rate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const source=ctx.createBufferSource();source.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=3200;const gain=ctx.createGain(),now=ctx.currentTime;gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.85,now+.04);gain.gain.exponentialRampToValueAtTime(.40,now+.45);gain.gain.exponentialRampToValueAtTime(.001,now+duration);source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start(now);source.stop(now+duration);}catch(e){console.warn('Governor sound unavailable',e);}};if(ctx.state==='running')run();else ctx.resume().then(run).catch(()=>{});}function playBrakeAirSound(releasing=false){if(!soundEnabled||pressure<5)return;unlockGovernorAudio();const ctx=governorAudioContext;if(!ctx)return;const run=()=>{if(!soundEnabled)return;try{const duration=releasing?1.05:.65,rate=ctx.sampleRate,buffer=ctx.createBuffer(1,Math.ceil(rate*duration),rate),data=buffer.getChannelData(0);let smoothed=0;for(let i=0;i<data.length;i++){smoothed=.80*smoothed+.20*(Math.random()*2-1);data[i]=smoothed;}const source=ctx.createBufferSource();source.buffer=buffer;const highpass=ctx.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=220;const lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=releasing?2600:1900;const gain=ctx.createGain(),now=ctx.currentTime,level=(releasing?.27:.15)*Math.min(1,pressure/65);gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(level,now+(releasing?.18:.16));gain.gain.setValueAtTime(level,now+(releasing?.30:.23));gain.gain.linearRampToValueAtTime(0,now+duration);source.connect(highpass);highpass.connect(lowpass);lowpass.connect(gain);gain.connect(ctx.destination);source.start(now);source.stop(now+duration);}catch(e){console.warn('Brake air sound unavailable',e);}};if(ctx.state==='running')run();else ctx.resume().then(run).catch(()=>{});}let lowAirOsc=null,lowAirGain=null,lowAirToneTimer=null;function stopLowAirAlarm(){if(lowAirToneTimer){clearInterval(lowAirToneTimer);lowAirToneTimer=null;}if(lowAirOsc){try{lowAirOsc.stop()}catch(e){}lowAirOsc.disconnect();lowAirOsc=null;}if(lowAirGain){lowAirGain.disconnect();lowAirGain=null;}}function syncLowAirAlarm(){const shouldPlay=pressure<=60&&soundEnabled&&document.body.classList.contains('testing');if(!shouldPlay){stopLowAirAlarm();return;}if(lowAirOsc)return;unlockGovernorAudio();const ctx=governorAudioContext;if(!ctx||ctx.state!=='running')return;lowAirOsc=ctx.createOscillator();lowAirGain=ctx.createGain();lowAirOsc.type='square';lowAirOsc.frequency.value=680;lowAirGain.gain.value=.0001;lowAirOsc.connect(lowAirGain);lowAirGain.connect(ctx.destination);lowAirOsc.start();let on=false;const pulse=()=>{if(!lowAirGain)return;on=!on;lowAirGain.gain.setTargetAtTime(on?.045:.0001,ctx.currentTime,.012)};pulse();lowAirToneTimer=setInterval(pulse,420);}let soundEnabled=true;function syncEngineSound(){if(engine&&soundEnabled)startEngineAudio();else stopEngineAudio();}$('soundToggle').onclick=()=>{soundEnabled=!soundEnabled;$('soundToggle').textContent=soundEnabled?'🔊 Sound ON':'🔇 Sound OFF';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled));$('soundToggle').setAttribute('aria-label',soundEnabled?'Mute engine sound':'Unmute engine sound');unlockGovernorAudio();syncEngineSound();syncLowAirAlarm()};const initial=()=>{pressure=90;engine=false;parking=true;service=false;compressorOn=false;syncEngineSound();syncLowAirA
