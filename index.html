{title:'Read the Air Gauges',objective:'Find the PRIMARY and SECONDARY air pressure gauges. With the engine OFF, press and release the service brake THREE times. Watch both air pressure gauges after each press.',explain:'The two gauges show stored air pressure in the primary and secondary air systems. Watch their needles and pressure readings as using the service brake consumes air. In this introductory simulator both gauges follow the same simulated air supply; they do not model independent system failures.',check:()=>!engine&&missionBrakePresses>=3,question:'What does an air supply pressure gauge tell you?',choices:['How much air pressure is in the air tanks','How fast the bus is traveling','How hot the brakes are'],correct:0,answer:'CDL manual answer: the air supply pressure gauge shows how much pressure is in the air tanks.',followup:{question:'Why does a vehicle with a dual air brake system have two air pressure gauges?',choices:['One measures fuel and the other measures air','They show pressure in the two separate air systems','One is only used when parked'],correct:1,answer:'A dual air brake system has separate primary and secondary air systems. The gauges let the driver monitor air pressure in each system.'}},
{title:'Identify the Three Braking Systems',objective:'Identify the service brake pedal and yellow parking brake knob. With the engine OFF, apply the service brake to use some air, then release and reapply the parking brake. Observe how the controls differ.',explain:'CDL air brakes have three braking systems: service, parking, and emergency. The service brake is used for normal stopping. The parking brake holds a parked vehicle. The emergency system helps stop the vehicle if the service braking system fails; it is not a separate pedal on this simulator. The yellow knob demonstrates the spring parking brake, which may also apply automatically after severe air-pressure loss.',check:()=>!engine&&missionSawReleased&&parking&&pressure<=missionStartPressure-3,question:'What are the three braking systems in an air brake vehicle?',choices:['Service, parking, and emergency','Primary, secondary, and governor','Compressor, air tanks, and gauges'],correct:0,answer:'CDL manual answer: the three braking systems are service, parking, and emergency.',followup:{question:'Which braking system is used for normal stopping while driving?',choices:['Parking brake','Service brake','Compressor governor'],correct:1,answer:'The service brake system applies the brakes when the driver uses the brake pedal for normal stopping.'}},
{title:'Build Air Pressure',objective:'Start the engine and let the air system reach governor cut-out.',explain:'The engine-driven compressor fills the air system. The governor stops charging at the simulated cut-out pressure.',check:()=>engine&&pressure>=125,question:'What controls when the compressor cuts in and cuts out?',choices:['The governor','The parking brake knob','The service brake pedal'],correct:0,answer:'CDL manual answer: the air compressor governor controls when the compressor cuts in and cuts out.',followup:{question:'At approximately what pressure should the air compressor governor cut out?',choices:['100 PSI','125 PSI','40 PSI'],correct:1,answer:'CDL manual answer: the governor should cut out at approximately 125 PSI (manufacturer specifications may vary).'}},
{title:'Find Governor Cut-In',objective:'With the engine running, use the brake pedal to lower air pressure until charging resumes.',explain:'The governor allows the compressor to charge again when system pressure reaches its cut-in setting. Watch the gauges as you use air.',check:()=>engine&&missionSawHigh&&pressure<=100,question:'At approximately what pressure should the air compressor governor cut in?',choices:['40 PSI','100 PSI','150 PSI'],correct:1,answer:'CDL manual answer: the governor should cut in at approximately 100 PSI (manufacturer specifications may vary).'},{title:'Safety Valve Protection',objective:'Start the engine and build pressure to the normal 125 PSI governor cut-out. Then use the special safety-valve demonstration button to observe what would happen if pressure rose to 150 PSI.',explain:'The compressor governor normally cuts out at approximately 125 PSI. The safety valve is a separate protection against excessive air pressure and typically opens at approximately 150 PSI. The demonstration simulates this fault without actually increasing the air tanks above 125 PSI.',check:()=>safetyValveDemonstrated,question:'What does the safety valve protect against?',choices:['Excessive air pressure','Low fuel pressure','Worn brake linings'],correct:0,answer:'The safety valve protects the air brake system against excessive air pressure.',followup:{question:'At approximately what pressure does the safety valve typically open?',choices:['60 PSI','125 PSI','150 PSI'],correct:2,answer:'The safety valve typically opens at approximately 150 PSI to relieve excessive air pressure.'}},
{title:'Low-Air Emergency',objective:'Turn off the engine and use the brake pedal until the low-air warning activates.',explain:'Using the service brakes consumes stored air. The buzzer and red warning signal alert the driver before pressure becomes dangerously low.',check:()=>!engine&&pressure<=60,question:'When must the low-air warning activate?',choices:['Only after the parking brake pops out','Before pressure falls below 60 PSI','Only when the engine is running'],correct:1,answer:'CDL manual answer: the low-air warning must activate before pressure falls below 60 PSI. Some large buses use higher thresholds.',followup:{question:'What should you do if the low-air pressure warning comes on while driving?',choices:['Continue driving until the spring brakes apply','Stop and safely park as soon as possible','Pump the service brake repeatedly to restore air pressure'],correct:1,answer:'CDL manual guidance: stop and safely park as soon as possible while enough air remains for controlled braking. Do not wait for spring brakes to apply.'}},
{title:'Spring Brake Challenge',objective:'With the engine off and parking brake released, lower air pressure until the yellow knob pops OUT automatically.',explain:'Spring brakes use mechanical spring force to apply. When the system loses enough air, the parking brake valve can pop out automatically.',check:()=>missionSawReleased&&parking&&pressure<=40,question:'In what pressure range may spring parking brakes apply automatically?',choices:['100–125 PSI','60–90 PSI','20–45 PSI'],correct:2,answer:'CDL manual answer: spring brake valves typically pop out between 20 and 45 PSI, depending on the vehicle.'},
{title:'Restore Air Pressure',objective:'After the spring brake emergency, start the engine and rebuild air pressure to at least 100 PSI on both gauges. Then, while holding the service brake, release the yellow parking brake knob.',explain:'Spring parking brakes need adequate air pressure to release. After a low-air event, restore pressure before attempting to release them. In a real vehicle, identify and correct the cause of air loss and complete required checks before moving; this mission is only a controls demonstration.',check:()=>engine&&pressure>=100&&!parking,question:'Before driving a vehicle with a dual air brake system, what minimum air pressure should be built in both systems?',choices:['At least 40 PSI','At least 60 PSI','At least 100 PSI'],correct:2,answer:'The CDL manual directs drivers to build at least 100 PSI in both primary and secondary air systems before driving. A real vehicle must also be safe and roadworthy.'},
{title:"Don't Waste Air",objective:'With the engine off, repeatedly apply and release the service brake to reduce air pressure by at least 15 PSI.',explain:'Each service brake application uses compressed air. Repeated unnecessary applications can deplete the air supply.',check:()=>!engine&&missionStartPressure-pressure>=15,question:'Why should you avoid unnecessary repeated brake applications?',choices:['They waste stored air pressure','They increase air pressure','They turn off the governor'],correct:0,answer:'Repeated applications consume stored air and can lead to a low-air condition.'}
,{title:'Applied Air Leakage Test',objective:'Build pressure to 125 PSI, turn the engine OFF, press and HOLD the service brake, and release the parking brake while keeping the service brake applied. Hold the pedal throughout the timed applied leakage test.',explain:'For a single school bus, applied air leakage must not exceed 3 PSI in one minute. The pressure drop when first pressing the brake is excluded. This simulation uses a 15-second accelerated timer to represent one minute; real inspections require the full minute.',check:()=>leakPhase==='complete',question:'What is the maximum permitted applied air loss in one minute for a single school bus?',choices:['2 PSI','3 PSI','6 PSI'],correct:1,answer:'A single vehicle should lose no more than 3 PSI in one minute with the service brake applied.',followup:{question:'For a single school bus, what is the maximum permitted STATIC air leakage in one minute with the brakes released?',choices:['2 PSI','3 PSI','5 PSI'],correct:0,answer:'For a single vehicle, static air leakage should not exceed 2 PSI in one minute with the brakes released. Secure the vehicle against movement before testing.'}}

,{title:'Service Brake Check',objective:'Build sufficient air pressure, start the engine, HOLD the service brake while releasing the parking brake, then release the pedal. Release the service brake to begin moving at about 5 MPH, then press the service brake again to stop. Observe whether it stops straight and smoothly.',explain:'The service brake check is performed at low speed in a safe area. The bus should stop smoothly without pulling to one side, unusual feel, or delayed response. The moving road is illustrative; this is not a driving simulator.',check:()=>brakeCheckPhase==='complete',question:'During a low-speed service brake check, what indicates the service brakes are working properly?',choices:['The bus stops straight and smoothly','The bus pulls to one side when braking','The air compressor reaches cut-out'],correct:0,answer:'A proper service brake check shows that the bus stops smoothly and straight without pulling to either side.',followup:{question:'How should you check service brakes during a pre-trip inspection?',choices:['Drive slowly in a safe area and apply the service brake','Apply only the parking brake at highway speed','Pump the brake repeatedly while parked'],correct:0,answer:'Move slowly in a safe area and apply the service brake to check for normal stopping and no pulling.'}}
,{title:'Parking Brake Check',objective:'Start the engine and build normal air pressure. With the service brake held, confirm the yellow parking brake knob is PULLED OUT (applied). Release the service brake, then tap Gently Pull Against Parking Brake to perform a low-gear tug test.',explain:'To check the parking brake, set the parking brake and gently pull against it in a low gear. The parking brake should hold the vehicle stationary. A bus that moves during this check fails and must not be driven until repaired. The simulated tug does not represent normal driving.',check:()=>parkingCheckPhase==='complete',question:'How do you check that the parking brake works?',choices:['Gently pull against it in a low gear with the parking brake applied','Release the parking brake and drive at highway speed','Pump the service brake until the low-air warning sounds'],correct:0,answer:'With the parking brake applied, gently pull against it in a low gear. It should hold the vehicle.',followup:{question:'What should you do if the bus moves during the parking brake test?',choices:['Drive carefully and check it later','Do not drive until the parking brake is repaired','Use only the service brake when parking'],correct:1,answer:'If the parking brake does not hold, the vehicle is unsafe to operate until the defect is corrected.'}}
];
let leakPhase='idle',leakElapsed=0,leakStart=0,leakScenario=0,leakAppliedLoss=0;
let safetyValveDemonstrated=false,brakeCheckPhase='idle',brakeCheckFault=false,parkingCheckPhase='idle',parkingCheckFault=false,parkingTugTimer=null;
let missionIndex=-1,missionStage='idle',missionBrakePresses=0,missionStartPressure=90,missionSawHigh=false,missionSawReleased=false,missionLastNotice='';let missionCompletionTimer=null;function clearMissionCompletionTimer(){if(missionCompletionTimer!==null){clearTimeout(missionCompletionTimer);missionCompletionTimer=null;}}
function missionDialog(title,html){$('missionTitle');$('missionOverlay').hidden=false;$('missionDialog').innerHTML='<h2 id="missionTitle">'+title+'</h2>'+html;}
function missionCloseDialog(){$('missionOverlay').hidden=true;}
function missionMenu(){if(missionIndex>=0)missionExit();missionDialog('Choose an Air Brake Mission','<p class="mission-note">Select any mission to practice. You can return to this menu at any time.</p><div id="missionMenuList" class="mission-menu-list"></div><button id="missionMenuClose" class="alt">Close</button>');const list=$('missionMenuList');missionData.forEach((m,i)=>{const b=document.createElement('button');b.type='button';const n=document.createElement('span');n.textContent='MISSION '+(i+1);b.appendChild(n);b.appendChild(document.createTextNode(m.title));b.onclick=()=>missionStart(i);list.appendChild(b)});$('missionMenuClose').onclick=missionCloseDialog;}
function missionStart(i){clearMissionCompletionTimer();if(parkingTugTimer!==null){clearTimeout(parkingTugTimer);parkingTugTimer=null;}missionIndex=i;missionStage='action';missionLastNotice='';initial();safetyValveDemonstrated=false;if(i===2){pressure=100;render();}if(i===3){pressure=125;compressorOn=false;render();}if(i===6){pressure=40;parking=true;compressorOn=false;render();}if(i===11){pressure=100;parking=true;parkingCheckPhase='prepare';parkingCheckFault=Math.random()<.5;render();}else parkingCheckPhase='idle';if(i===10){pressure=100;parking=true;brakeCheckPhase='prepare';brakeCheckFault=Math.random()<.5;render();}else brakeCheckPhase='idle';if(i===9){pressure=100;parking=true;compressorOn=false;leakPhase='prepare';leakElapsed=0;leakScenario=Math.random()<.5?0:1;leakAppliedLoss=0;render();}else leakPhase='idle';missionBrakePresses=0;missionStartPressure=pressure;missionSawHigh=pressure>100;missionSawReleased=false;document.body.classList.add('testing');$('testScreen').hidden=false;$('testScreen').style.display='block';$('missionHud').hidden=false;missionHudUpdate();const m=missionData[i];missionDialog('Mission '+(i+1)+': '+m.title,'<p>'+m.objective+'</p><p class="mission-note">Operate the real simulator controls to complete the challenge. You can open an explanation at any time.</p><button id="missionGo">Begin mission</button><button id="missionLeave" class="alt">Exit</button>');$('missionGo').onclick=missionCloseDialog;$('missionLeave').onclick=missionExit;}
function missionHudUpdate(){if(missionIndex<0)return;const m=missionData[missionIndex];$('parkingTug').hidden=missionIndex!==11;$('creepForward').hidden=true;$('roadDemo').className='road-demo'+((missionIndex===10||missionIndex===11)?' active':'');$('roadSpeed').textContent='0 MPH';$('safetyValveDemo').hidden=missionIndex!==4;$('missionHudTitle').textContent='MISSION '+(missionIndex+1)+'/'+missionData.length+' · '+m.title;$('missionHudText').textContent=m.objective;}
function missionExit(){clearMissionCompletionTimer();if(parkingTugTimer!==null){clearTimeout(parkingTugTimer);parkingTugTimer=null;}$('parkingTug').hidden=true;parkingCheckPhase='idle';$('creepForward').hidden=true;$('roadDemo').className='road-demo';brakeCheckPhase='idle';$('safetyValveDemo').hidden=true;missionIndex=-1;missionStage='idle';missionCloseDialog();$('missionHud').hidden=true;stopLowAirAlarm();}
function missionQuestion(){if(missionStage!=='observing'&&missionStage!=='action')return;missionStage='question';const m=missionData[missionIndex];function showQuestion(q,heading){missionDialog(heading,'<p>'+m.explain+'</p>'+(missionIndex===9?'<p><strong>Measured applied loss: '+leakAppliedLoss+' PSI ('+(leakAppliedLoss<=3?'PASS':'FAIL')+').</strong></p>':'')+'<p><strong>DMV-style knowledge check:</strong> '+q.question+'</p><div id="missionAnswers"></div><p id="missionFeedback" aria-live="polite"></p>');const answers=$('missionAnswers');q.choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='mission-choice';b.textContent=choice;b.onclick=()=>{const good=i===q.correct;$('missionFeedback').textContent=(good?'Correct! ':'Try again. ')+(good?q.answer:'Think about what the simulator demonstrated.');if(good){answers.innerHTML='';const next=document.createElement('button');if(q.followup){next.textContent='Next question';next.onclick=()=>showQuestion(q.followup,m.title+' · next knowledge check');}else{missionStage='done';next.textContent=missionIndex===missionData.length-1?'Finish missions':'Next mission';next.onclick=()=>{if(missionIndex===missionData.length-1){missionDialog('Training complete','<p>You completed all '+missionData.length+' air brake missions and their knowledge checks.</p><button id="missionAgain">Practice again</button><button id="missionDone" class="alt">Free practice</button>');$('missionAgain').onclick=()=>missionStart(0);$('missionDone').onclick=missionExit;}else missionStart(missionIndex+1)};}answers.appendChild(next);}};answers.appendChild(b);});}showQuestion(m,'Mission accomplished!');}
$('safetyValveDemo').onclick=()=>{if(missionIndex!==4||missionStage!=='action'||!engine||pressure<125){alert('First start the engine and reach governor cut-out at 125 PSI.');return;}safetyValveDemonstrated=true;playGovernorPurge();$('missionHudText').textContent='Simulated safety valve opens at 150 PSI to relieve excess pressure.';missionTick();};
$('creepForward').onclick=()=>{if(missionIndex!==10||missionStage!=='action')return;if(brakeCheckPhase!=='ready'||!engine||parking||service||pressure<120){alert('Start engine, build sufficient pressure, hold the service brake while releasing the parking brake, then release the service brake before creeping forward.');return;}brakeCheckPhase='moving';$('roadDemo').className='road-demo active moving';$('roadSpeed').textContent='5 MPH';$('creepForward').disabled=true;};
$('parkingTug').onclick=()=>{if(missionIndex!==11||missionStage!=='action')return;if(parkingCheckPhase!=='ready'||!engine||!parking||service||pressure<120){alert('Build normal pressure, apply the parking brake (yellow knob OUT), and release the service brake before the gentle tug test.');return;}parkingCheckPhase='tugging';$('parkingTug').disabled=true;$('roadDemo').className='road-demo active'+(parkingCheckFault?' moving':'');$('roadSpeed').textContent=parkingCheckFault?'BUS CREEPING':'0 MPH';$('missionHudText').textContent='Gently pulling against the applied parking brake…';parkingTugTimer=setTimeout(()=>{parkingTugTimer=null;if(missionIndex!==11||missionStage!=='action')return;parkingCheckPhase='complete';$('roadDemo').className='road-demo active'+(parkingCheckFault?' pull-left':'');$('roadSpeed').textContent='0 MPH';$('missionHudText').textContent=parkingCheckFault?'FAIL: Bus moved during tug test — parking brake requires repair':'PASS: Parking brake held the bus stationary';$('parkingTug').disabled=false;missionTick();},1500);};
function missionTick(){if(missionIndex===10&&missionStage==='action'&&brakeCheckPhase==='ready'&&!service&&!parking&&engine&&pressure>=90){brakeCheckPhase='moving';$('roadDemo').className='road-demo active moving';$('roadSpeed').textContent='5 MPH';}
if(missionIndex===11&&missionStage==='action'&&$('missionOverlay').hidden!==false){if(parkingCheckPhase==='prepare'&&engine&&parking&&pressure>=120)parkingCheckPhase='ready';if(parkingCheckPhase==='ready')$('missionHudText').textContent='Parking brake applied · release service brake, then tap Gently Pull Against Parking Brake';else if(parkingCheckPhase==='prepare')$('missionHudText').textContent='Start engine, build pressure to 120–125 PSI, and apply parking brake';}
if(missionIndex===10&&missionStage==='action'&&$('missionOverlay').hidden!==false){if(brakeCheckPhase==='prepare'&&engine&&!parking&&service&&pressure>=120)brakeCheckPhase='ready';if(brakeCheckPhase==='moving'&&service){brakeCheckPhase='complete';$('roadDemo').className='road-demo active'+(brakeCheckFault?' pull-left':'');$('roadSpeed').textContent='0 MPH';$('creepForward').disabled=false;$('missionHudText').textContent=brakeCheckFault?'Bus stopped but PULLED LEFT — inspection failure':'Bus stopped smoothly and straight — inspection pass';}else if(brakeCheckPhase==='prepare'||brakeCheckPhase==='ready'){$('missionHudText').textContent=brakeCheckPhase==='prepare'?'Start engine, hold service brake and release parking brake':'Release service brake, to begin moving automatically at 5 MPH';}}
if(missionIndex===9&&missionStage==='action'&&$('missionOverlay').hidden!==false){if(leakPhase==='prepare'&&!engine&&!parking&&service&&pressure>=90){leakPhase='applied';leakElapsed=0;leakStart=pressure;}if(leakPhase==='applied'){if(!service||engine||parking){leakPhase='prepare';leakElapsed=0;}else{leakElapsed++;pressure=clamp(pressure-(leakScenario?0.12:0.045));if(leakElapsed>=30){leakAppliedLoss=+(leakStart-pressure).toFixed(1);leakPhase='complete';}}}const label=leakPhase==='prepare'?'Build to 125 PSI, turn engine OFF, HOLD service brake, then release parking brake':leakPhase==='applied'?'Hold service brake · applied leakage test: '+Math.ceil((30-leakElapsed)/2)+' simulated seconds remaining (15 real seconds = 1 simulated minute)':'Applied loss: '+leakAppliedLoss+' PSI ('+(leakAppliedLoss<=3?'PASS':'FAIL')+')';$('missionHudText').textContent=label;}
if(missionIndex<0||missionStage!=='action'||$('missionOverlay').hidden===false)return;const m=missionData[missionIndex];if(pressure>100)missionSawHigh=true;if(!parking)missionSawReleased=true;if(missionIndex===0)$('missionHudText').textContent='Press and release the service brake 3 times · '+Math.min(3,missionBrakePresses)+'/3 completed';if(m.check()){missionStage='observing';$('missionHudText').textContent='Objective complete! Observe the gauges and controls…';const completedMission=missionIndex;missionCompletionTimer=setTimeout(()=>{missionCompletionTimer=null;if(missionIndex===completedMission&&missionStage==='observing')missionQuestion();},2500);}}
$('startMissions').onclick=missionMenu;$('missionChoose').onclick=missionMenu;
$('missionHint').onclick=()=>{if(missionIndex<0)return;const m=missionData[missionIndex];missionDialog('What is happening?','<p>'+m.explain+'</p><button id="missionResume">Continue mission</button>');$('missionResume').onclick=missionCloseDialog;};
$('missionExit').onclick=missionExit;
const lessons={build:'Start the engine and watch air pressure increase. At 125 PSI, listen for the illustrative governor air-purge sound as the compressor cuts out.',warning:'Stop the engine, then pump the service brake until the low-air warning activates.',spring:'With the engine off, pump the brakes until the spring parking brake sets automatically.',applied:'Apply and hold the service brake with the engine off. Watch for air loss over time.'};$('lesson').onchange=()=>{$('instructions').textContent=lessons[$('lesson').value]};$('lesson').onchange();
setInterval(()=>{if(engine){if(pressure<=100)compressorOn=true;if(compressorOn){pressure=clamp(pressure+1.5);if(pressure>=125){pressure=125;compressorOn=false;playGovernorPurge();}}}else{compressorOn=false}if(service&&!engine&&missionIndex!==8)pressure=clamp(pressure-.12);applyAutomaticSpringBrake();render();missionTick()},500);render();
</script></body></html>
