<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills & Vision | Air Brake Simulator</title><style>
:root{font-family:system-ui,Arial;background:#101827;color:#eef3fc}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;background:#19263b;border-bottom:2px solid #dba94d}h1{margin:4px 0;font-size:clamp(23px,4vw,34px)}.muted{color:#aebcd1}main{max-width:1100px;margin:auto;padding:22px 15px}.panel{background:#1a2940;border:1px solid #364a63;border-radius:16px;padding:20px;margin:14px 0}.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.gauge{background:#0b1321;border-radius:14px;text-align:center;padding:20px 8px}.psi{font-size:clamp(34px,8vw,65px);font-weight:800;color:#e9bc62}.bar{height:13px;border-radius:20px;background:#344157;overflow:hidden;margin:15px}.fill{height:100%;background:#61c79c;transition:width .3s}.controls{display:flex;flex-wrap:wrap;gap:10px}button,select{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:650}button{background:#e6b75e;color:#142032;cursor:pointer}button.alt{background:#314763;color:white}button:active{transform:scale(.98)}.status{padding:12px;border-radius:9px;background:#263952}.warn{background:#713a30}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid,.gauges{grid-template-columns:1fr}}li{margin:9px 0}small{color:#b5c2d3}.cockpit{position:relative;width:100%;height:100dvh;min-height:500px;background:#101827 url('school-bus-cockpit.png') center center/cover no-repeat;overflow:hidden}.cockpit:after{content:'';position:absolute;inset:65% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}.cockpit-top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}.cockpit-brand{background:rgba(12,23,35,.85);padding:12px 17px;border-radius:12px;backdrop-filter:blur(8px);font-weight:700}.cockpit-brand small{display:block;font-weight:400}.start-test{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;box-shadow:0 6px 30px #0009}.test-screen{display:none}.testing .test-screen{display:block}.testing .cockpit{width:calc(100% - min(360px,35vw));height:100dvh;min-height:500px;background-position:center}.testing .test-screen{display:block;position:absolute;top:0;right:0;width:min(360px,35vw);height:100dvh;overflow:auto;background:#152236}.testing .test-screen header{display:none;padding:12px}.testing .test-screen header h1{font-size:18px}.testing .test-screen main{padding:10px}.testing .test-screen .panel{padding:12px;margin:8px 0}.testing .gauges{grid-template-columns:1fr 1fr;gap:6px}.testing .gauge{padding:8px 2px}.testing .psi{font-size:22px}.testing .grid{grid-template-columns:1fr}.testing .test-screen .bar{margin:8px}.dial{width:100%;max-width:150px;aspect-ratio:1;margin:auto;display:block}.needle{transition:transform .3s ease;transform-origin:100px 100px}.pedal-wrap{padding:10px;text-align:center}.pedal{display:block;margin:auto;width:110px;height:150px;background:repeating-linear-gradient(0deg,#252c35 0 10px,#56616c 11px 15px);border:8px solid #78818d;border-radius:14px;box-shadow:0 16px 0 #0b1017,0 22px 20px #0008;transform-origin:center top;transition:transform .12s,box-shadow .12s;touch-action:none;user-select:none}.pedal.pressed{transform:perspective(300px) rotateX(23deg) translateY(14px);box-shadow:0 3px 0 #0b1017}.pedal:focus-visible{outline:3px solid #e6b75e}.testing .start-test{display:none}@media(max-width:700px){.testing .cockpit{width:100%;height:48dvh;min-height:260px}.testing .test-screen{display:block;position:relative;width:100%;height:auto}.testing .test-screen .gauges{grid-template-columns:1fr 1fr}}.testing .start-test{display:none}.back-button{display:none}.testing .back-button{display:inline-block}@media(max-width:600px){.cockpit{background-position:47% center}.cockpit-brand{font-size:13px}.cockpit-brand small{font-size:10px}.start-test{bottom:35px}}</style></head>
<body><section class="cockpit" aria-label="School bus cockpit"><div class="cockpit-top"><div class="cockpit-brand">SKILLS & VISION SOLUTIONS<small>School Bus Air Brake Simulator</small></div><button class="alt back-button" id="backCockpit">Full cockpit</button></div><button class="start-test" id="startTest">Start Air Brake Test</button></section><div class="test-screen"><main>
<div class="gauges"><div class="gauge"><div>PRIMARY AIR</div><svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Primary pressure dial"><circle cx="100" cy="100" r="91" fill="#080d16" stroke="#7e8b98" stroke-width="5"/><path d="M 35 154 A 85 85 0 1 1 165 154" fill="none" stroke="#d8ad58" stroke-width="3"/><text x="47.9" y="143.7" text-anchor="middle" fill="#fff" font-size="13">0</text><text x="32.2" y="95.3" text-anchor="middle" fill="#fff" font-size="13">30</text><text x="54.5" y="49.5" text-anchor="middle" fill="#fff" font-size="13">60</text><text x="102.4" y="32.0" text-anchor="middle" fill="#fff" font-size="13">90</text><text x="148.9" y="52.8" text-anchor="middle" fill="#fff" font-size="13">120</text><text x="168.0" y="100.0" text-anchor="middle" fill="#fff" font-size="13">150</text><g id="primaryNeedle" class="needle"><path d="M100 112 L97 98 L100 32 L103 98 Z" fill="#f2574c"/></g><circle cx="100" cy="100" r="8" fill="#ddd"/><text x="100" y="143" fill="#ddd" font-size="14" text-anchor="middle">PSI</text></svg><div class="psi"><span id="primary">90</span> <small>PSI</small></div><div class="bar"><div class="fill" id="pbar"></div></div></div><div class="gauge"><div>SECONDARY AIR</div><svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Secondary pressure dial"><circle cx="100" cy="100" r="91" fill="#080d16" stroke="#7e8b98" stroke-width="5"/><path d="M 35 154 A 85 85 0 1 1 165 154" fill="none" stroke="#d8ad58" stroke-width="3"/><text x="47.9" y="143.7" text-anchor="middle" fill="#fff" font-size="13">0</text><text x="32.2" y="95.3" text-anchor="middle" fill="#fff" font-size="13">30</text><text x="54.5" y="49.5" text-anchor="middle" fill="#fff" font-size="13">60</text><text x="102.4" y="32.0" text-anchor="middle" fill="#fff" font-size="13">90</text><text x="148.9" y="52.8" text-anchor="middle" fill="#fff" font-size="13">120</text><text x="168.0" y="100.0" text-anchor="middle" fill="#fff" font-size="13">150</text><g id="secondaryNeedle" class="needle"><path d="M100 112 L97 98 L100 32 L103 98 Z" fill="#f2574c"/></g><circle cx="100" cy="100" r="8" fill="#ddd"/><text x="100" y="143" fill="#ddd" font-size="14" text-anchor="middle">PSI</text></svg><div class="psi"><span id="secondary">90</span> <small>PSI</small></div><div class="bar"><div class="fill" id="sbar"></div></div></div></div>
<div class="panel pedal-wrap"><h2>Service brake pedal</h2><button type="button" class="pedal" id="pedal" aria-label="Press and hold service brake pedal" aria-pressed="false"></button></div><div class="panel"><div class="controls"><button id="engine">Start engine</button><button id="parking">Release parking brake</button><button id="reset" class="alt">Reset</button></div><p id="warningState" class="status">Low-air warning: OFF</p><p id="compressorState" class="status">Compressor: OFF</p></div><div hidden><button id="service"></button><button id="pump"></button><span id="engineState"></span><span id="brakeState"></span><span id="serviceState"></span><select id="lesson"><option value="build">Pressure buildup</option></select><span id="instructions"></span></div></main></div>
<script>
const $=id=>document.getElementById(id);$('startTest').onclick=()=>{document.body.classList.add('testing');window.scrollTo({top:0,behavior:'smooth'})};$('backCockpit').onclick=()=>{document.body.classList.remove('testing');window.scrollTo({top:0,behavior:'smooth'})};let pressure=90,engine=false,parking=true,service=false,compressorOn=false;const initial=()=>{pressure=90;engine=false;parking=true;service=false;compressorOn=false;render()};const clamp=x=>Math.max(0,Math.min(125,x));function render(){let p=clamp(pressure);$('primaryNeedle').style.transform='rotate('+(-130+p/150*260)+'deg)';$('secondaryNeedle').style.transform='rotate('+(-130+clamp(p-1)/150*260)+'deg)';$('pedal').classList.toggle('pressed',service);$('pedal').setAttribute('aria-pressed',String(service));$('primary').textContent=Math.round(p);$('secondary').textContent=Math.round(clamp(p-1));$('pbar').style.width=p/125*100+'%';$('sbar').style.width=clamp(p-1)/125*100+'%';$('engine').textContent=engine?'Stop engine':'Start engine';$('compressorState').textContent='Compressor: '+(engine?(compressorOn?'CHARGING':'STANDBY'):'OFF');$('parking').textContent=parking?'Release parking brake':'Set parking brake';$('engineState').textContent='Engine: '+(engine?'RUNNING':'OFF');$('brakeState').textContent='Parking brake: '+(parking?'SET':'RELEASED');$('warningState').textContent='Low-air warning: '+(p<60?'ON (illustrative)':'OFF');$('warningState').className='status'+(p<60?' warn':'');$('serviceState').textContent='Service brake: '+(service?'APPLIED':'RELEASED');$('service').textContent=service?'Release service brake':'Apply service brake';}
$('engine').onclick=()=>{engine=!engine;if(engine&&pressure<120)compressorOn=true;if(!engine)compressorOn=false;render()};$('parking').onclick=()=>{if(parking&&pressure<60){alert('Insufficient air pressure in this demonstration to release parking brake.');return}parking=!parking;render()};$('pump').onclick=()=>{pressure=clamp(pressure-5);if(pressure<40)parking=true;render()};$('service').onclick=()=>{service=!service;render()};const pedal=$('pedal');pedal.addEventListener('pointerdown',e=>{e.preventDefault();pedal.setPointerCapture(e.pointerId);if(!service)pressure=clamp(pressure-3);service=true;render()});function releasePedal(){service=false;render()}pedal.addEventListener('pointerup',releasePedal);pedal.addEventListener('pointercancel',releasePedal);pedal.addEventListener('lostpointercapture',releasePedal);pedal.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();if(!service)pressure=clamp(pressure-3);service=true;render()}});pedal.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();releasePedal()}});$('reset').onclick=initial;
const lessons={build:'Start the engine and watch air pressure increase. Observe the illustrative compressor cut-out.',warning:'Stop the engine, then pump the service brake until the low-air warning activates.',spring:'With the engine off, pump the brakes until the spring parking brake sets automatically.',applied:'Apply and hold the service brake with the engine off. Watch for air loss over time.'};$('lesson').onchange=()=>{$('instructions').textContent=lessons[$('lesson').value]};$('lesson').onchange();
setInterval(()=>{if(engine){if(pressure<=100)compressorOn=true;if(pressure>=120)compressorOn=false;if(compressorOn)pressure=clamp(pressure+1.5)}else{compressorOn=false}if(service&&!engine)pressure=clamp(pressure-.12);if(pressure<40)parking=true;render()},500);render();
</script></body></html>
