<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1c2d"><title>Skills | Windshield Stopping Distance Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1828;color:#eef5fc;font:16px system-ui,Arial}header{padding:18px max(18px,calc((100vw - 1100px)/2));background:#142a40;border-bottom:2px solid #e3b453}header a{color:#f2cf86;text-decoration:none}h1{margin:9px 0 3px;font-size:clamp(24px,4vw,34px)}p{line-height:1.5;color:#c2d4e4}main{max-width:1100px;margin:auto;padding:18px}.card{background:#14293d;border:1px solid #39536b;border-radius:16px;padding:18px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:700}select,input{width:100%;margin-top:8px;padding:11px;border-radius:9px;border:1px solid #658096;background:#0b1c2c;color:#fff;font-size:16px}button{border:0;border-radius:10px;padding:13px 19px;font-size:16px;font-weight:750;background:#efbd52;color:#172536;cursor:pointer}button.secondary{background:#34536c;color:white}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.road{overflow:hidden;border-radius:13px;background:#b9dbed}.road svg{display:block;width:100%;height:auto}.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.readout{background:#0a1c2e;padding:12px;border-radius:10px}.readout strong{display:block;font-size:23px;color:#f0c568}.readout span{font-size:12px;color:#b9cbd9}.message{padding:13px;border-radius:10px;background:#29465c;margin-top:12px;min-height:50px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#d8e7ef}.legend b{display:inline-block;width:13px;height:13px;margin-right:4px;vertical-align:middle}.windshield{position:relative;overflow:hidden;border:10px solid #17222e;border-radius:36px 36px 12px 12px;background:#8dc8ec;box-shadow:inset 0 0 0 3px #465969}.windshield svg{width:100%;display:block;aspect-ratio:900/440}.dashboard{background:linear-gradient(#273b4b,#111e2a);border-radius:0 0 18px 18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;border:2px solid #526271}.dash-label{font-size:12px;color:#b8c8d5}.pedals{display:flex;gap:22px;align-items:end}.pedal{position:relative;min-height:135px;width:105px;background:transparent!important;border:0!important;box-shadow:none!important;padding:5px;touch-action:none;user-select:none;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:4px;transform:none!important}.pedal-face{display:flex;align-items:center;justify-content:center;width:76px;height:106px;border-radius:12px 12px 18px 18px;background:repeating-linear-gradient(0deg,#20272c 0 7px,#465058 7px 11px);border:6px solid #777f83;box-shadow:inset 0 3px 8px #05090c,0 9px 0 #060d12;transform:perspective(160px) rotateX(15deg);transition:transform .09s,box-shadow .09s}.pedal.brake .pedal-face{width:91px;height:75px;border-radius:9px;background:repeating-linear-gradient(0deg,#262d32 0 6px,#4b545a 6px 11px)}.pedal.pressed .pedal-face{transform:perspective(160px) rotateX(30deg) translateY(7px);box-shadow:inset 0 3px 10px #05090c,0 2px 0 #060d12}.pedal small{font-size:11px;color:#cddbe4}.pedal span{font-size:13px;letter-spacing:1px}.speedometer{width:170px}.speedometer svg{display:block;width:100%}.driver-console{display:none}.note{font-size:13px}@media(max-width:680px){.controls{grid-template-columns:1fr}.readouts{grid-template-columns:repeat(2,1fr)}main{padding:10px}.card{padding:13px}}
header{display:flex;align-items:center;gap:15px;padding:10px 16px;justify-content:space-between}header strong{font-size:clamp(17px,3vw,23px)}header button{padding:9px 13px}main{padding:8px;max-width:1100px}.simulator{padding:8px;margin:0}.windshield{border-width:5px;border-radius:16px 16px 4px 4px}.dashboard{padding:6px;gap:8px}.speedometer{width:130px}.pedal{min-height:110px;width:95px}.pedal-face{height:75px;width:65px}.pedal.brake .pedal-face{height:62px;width:80px}.readouts{margin-top:8px}.readout{padding:8px}.readout strong{font-size:19px}.message{margin-top:8px;padding:9px}.settings{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0;padding:10px;background:#14293d;border-radius:12px}.settings label{flex:1;min-width:135px;font-size:13px}.settings select,.settings input{margin-top:5px}.settings input{padding:0}@media(max-width:600px){header{padding:9px}main{padding:0}.simulator{border-radius:0}.dashboard{justify-content:space-around}.readout span{font-size:11px}.settings{margin:8px}.pedals{gap:10px}} </style></head><body><header><a href="index.html">‹ Back</a><strong>Stopping Distance Lab</strong><button id="reset" class="secondary" type="button">Reset</button></header><main><section class="card simulator"><div class="windshield"><svg id="scene" viewBox="0 0 900 440" role="img" aria-label="Driver's windshield view of the road"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#70b8e4"/><stop offset="1" stop-color="#d9eff7"/></linearGradient><linearGradient id="asphalt" x2="0" y2="1"><stop stop-color="#687984"/><stop offset="1" stop-color="#39434c"/></linearGradient></defs><rect width="900" height="440" fill="url(#sky)"/><circle cx="745" cy="70" r="34" fill="#fff4c4"/><path d="M0 205L110 145L230 202L310 166L450 206L560 161L670 200L785 148L900 207V310H0Z" fill="#87a9a1"/><path d="M0 235Q170 190 320 228T650 230T900 223V440H0Z" fill="#6a9a70"/><path d="M390 213H510L900 440H0Z" fill="url(#asphalt)"/><path d="M390 213L0 440M510 213L900 440" fill="none" stroke="#e8e5ce" stroke-width="5"/><g id="roadLines"></g><g id="trees"><g id="leftTree"><path d="M245 231v-40" stroke="#69503b" stroke-width="8"/><circle cx="245" cy="184" r="28" fill="#3d7751"/></g><g id="rightTree"><path d="M665 231v-40" stroke="#69503b" stroke-width="8"/><circle cx="665" cy="184" r="28" fill="#3d7751"/></g></g><g id="obstacle" transform="translate(450 225) scale(.12)" style="display:none"><rect x="-145" y="-100" width="290" height="170" rx="22" fill="#bb463e" stroke="#fff" stroke-width="15"/><text y="12" text-anchor="middle" font-size="72" fill="white" font-weight="800">STOP</text></g><path d="M0 0H900V22H0ZM0 0H26V440H0ZM874 0H900V440H874Z" fill="#202b36"/><path d="M0 385Q450 352 900 385V440H0Z" fill="#182734"/><text id="phase" x="42" y="48" fill="#163449" font-weight="800" font-size="22">READY</text><text id="distanceOnRoad" x="42" y="76" fill="#183b51" font-size="17">Distance traveled: 0 ft</text></svg></div><div class="dashboard"><div><div class="dash-label">SCHOOL BUS DASHBOARD</div><div class="speedometer"><svg viewBox="0 0 180 116" aria-label="Live MPH speedometer"><path d="M24 92 A66 66 0 0 1 156 92" fill="none" stroke="#344d63" stroke-width="13" stroke-linecap="round"/><path d="M24 92 A66 66 0 0 1 156 92" fill="none" stroke="#e8bd60" stroke-width="5"/><g id="speedNeedle" transform="rotate(-90 90 92)"><path d="M90 92L90 34" stroke="#f9d87c" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="92" r="6" fill="#f9d87c"/></g><text id="liveSpeed" x="90" y="83" text-anchor="middle" fill="#fff" font-size="29" font-weight="800">0</text><text x="90" y="106" text-anchor="middle" fill="#b8d0df" font-size="11">MPH</text></svg></div></div><div class="pedals"><button id="brakePedal" class="pedal brake" type="button" aria-label="Hold brake pedal"><span class="pedal-face"></span><span>BRAKE</span><small>Hold to stop</small></button><button id="gasPedal" class="pedal gas" type="button" aria-label="Hold accelerator pedal"><span class="pedal-face"></span><span>GAS</span><small>Hold to accelerate</small></button></div></div><div class="readouts"><div class="readout"><strong id="total">0 ft</strong><span>Distance traveled</span></div><div class="readout"><strong id="perception">0 ft</strong><span>Distance before brake press</span></div><div class="readout"><strong id="reactionDistance">0 ft</strong><span>Air brake lag distance</span></div><div class="readout"><strong id="braking">0 ft</strong><span>Braking distance</span></div></div><div id="message" class="message" role="status">Select settings and start the demonstration.</div></section><section class="settings"><label>Max speed <output id="speedText">45</output> MPH<input id="speed" type="range" min="15" max="65" step="5" value="45"></label><label>Road <select id="road"><option value="dry">Dry</option><option value="wet">Wet</option><option value="ice">Snow / ice</option></select></label><label>Response <select id="reaction"><option value="0.75">Fast</option><option value="1" selected>Typical</option><option value="1.5">Slow</option><option value="2">Distracted</option></select></label></section></main><script>const $=id=>document.getElementById(id),fps=5280/3600;
let frame=null,last=0,started=false,gas=false,brake=false,speed=0,distance=0,elapsed=0,brakeStart=null,brakeSpeed=0,brakeDistance=0,brakeLag=0,brakeApplied=false,peakSpeed=0;
const fmt=n=>Math.round(n).toLocaleString()+' ft';
const decel=()=>({dry:12,wet:7,ice:2.5}[$('road').value]);
function speedometer(){const mph=speed/fps;$('liveSpeed').textContent=Math.round(mph);$('speedNeedle').setAttribute('transform','rotate('+(-90+Math.min(65,mph)/65*180)+' 90 92)')}
function render(){speedometer();$('distanceOnRoad').textContent='Distance traveled: '+fmt(distance);const offset=(distance%100)/100;let stripes='';for(let i=0;i<8;i++){const depth=((i/8+offset)%1),y=215+Math.pow(depth,1.7)*240,w=2+depth*20,h=2+depth*65;stripes+='<path d="M'+(450-w/2)+' '+y+'h'+w+'v'+h+'h-'+w+'Z" fill="#f3e8bc"/>'}$('roadLines').innerHTML=stripes;const shift=(distance%140)/140;$('leftTree').setAttribute('transform','translate('+(-shift*220)+' '+(shift*35)+') scale('+(1+shift*.3)+')');$('rightTree').setAttribute('transform','translate('+(shift*220)+' '+(shift*35)+') scale('+(1+shift*.3)+')');$('total').textContent=fmt(distance);$('perception').textContent=fmt(brakeStart===null?0:brakeDistance);$('reactionDistance').textContent=fmt(brakeLag);$('braking').textContent=fmt(Math.max(0,distance-brakeDistance-brakeLag))}
function reset(){if(frame)cancelAnimationFrame(frame);frame=null;started=false;last=0;gas=false;brake=false;speed=0;distance=0;elapsed=0;brakeStart=null;brakeSpeed=0;brakeDistance=0;brakeLag=0;brakeApplied=false;peakSpeed=0;$('phase').textContent='READY';$('message').textContent='Hold GAS to drive. Hold BRAKE to stop.';for(const id of ['gasPedal','brakePedal'])$(id).classList.remove('pressed');render()}
function loop(ts){if(!started)return;if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;elapsed+=dt;
 if(brake&&brakeStart===null){brakeStart=elapsed;brakeSpeed=speed;brakeDistance=distance;brakeApplied=false}
 if(brake){const delay=elapsed-brakeStart;if(delay<.5){brakeLag+=speed*dt;$('phase').textContent='AIR BRAKE LAG'}else{speed=Math.max(0,speed-decel()*dt);brakeApplied=true;$('phase').textContent='BRAKING'}}
 else if(gas){speed=Math.min((+$('speed').value)*fps,speed+10*dt);$('phase').textContent='ACCELERATING'}
 else{speed=Math.max(0,speed-.8*dt);$('phase').textContent=speed>0?'COASTING':'STOPPED'}
 peakSpeed=Math.max(peakSpeed,speed);distance+=speed*dt;render();
 if(brake&&brakeApplied&&speed===0){started=false;$('phase').textContent='STOPPED';$('message').textContent='Stopped after '+fmt(distance)+'. Distance from first brake press: '+fmt(distance-brakeDistance)+'. Air brake lag is modeled as 0.5 seconds; conditions and actual vehicles vary.';frame=null;return}
 frame=requestAnimationFrame(loop)}
function start(){if(started)return;started=true;last=0;$('message').textContent='Driving — release GAS to coast; hold BRAKE to stop.';frame=requestAnimationFrame(loop)}
function pedal(id,kind){const el=$(id);const set=down=>{if(down&&!started)start();if(kind==='gas')gas=down&&!brake;else{brake=down;if(!down&&brakeStart!==null&&speed>0){brakeStart=null;brakeApplied=false}}el.classList.toggle('pressed',down)};el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture','pointerleave'])el.addEventListener(ev,()=>set(false));}
$('reset').onclick=reset;$('speed').oninput=()=>{$('speedText').textContent=$('speed').value};$('road').onchange=()=>{};pedal('gasPedal','gas');pedal('brakePedal','brake');reset();</script></body></html>
