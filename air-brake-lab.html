"34\" rx=\"6\" fill=\"#d4ad5e\" stroke=\"#ffe1a0\" stroke-width=\"3\"/><path d=\"M547 110 Q556 88 564 110\" fill=\"none\" stroke=\"#e7c780\" stroke-width=\"5\"/><rect class=\"tag\" x=\"493\" y=\"58\" width=\"154\" height=\"38\" rx=\"11\"/><text x=\"570\" y=\"83\" text-anchor=\"middle\">Safety valve</text></g>\n<g><rect x=\"566\" y=\"193\" width=\"174\" height=\"81\" rx=\"36\" fill=\"url(#agTank)\" stroke=\"#9db4bf\" stroke-width=\"4\"/><ellipse cx=\"577\" cy=\"233\" rx=\"13\" ry=\"38\" fill=\"#334858\" stroke=\"#a3b8c2\" stroke-width=\"3\"/><path d=\"M607 198 V269 M706 198 V269\" stroke=\"#7892a1\" stroke-width=\"8\"/><rect class=\"tag\" x=\"574\" y=\"291\" width=\"158\" height=\"39\" rx=\"11\"/><text x=\"653\" y=\"317\" text-anchor=\"middle\">Supply tank</text></g>\n<text class=\"sub\" x=\"265\" y=\"199\" text-anchor=\"middle\">Control signal</text><text class=\"sub\" x=\"322\" y=\"262\" text-anchor=\"middle\">Air delivery</text><text class=\"sub\" x=\"568\" y=\"355\" text-anchor=\"middle\">Pressure relief branch</text>\n</svg>";
const spots=document.getElementById("spots"),dialog=document.getElementById("dialog"),close=document.getElementById("close");let lastFocus=null,simTimer=null,pressure=0,mode="idle",activeSection=0,engineOn=false;const engineAudio=new Audio("lesiakower-diesel-engine-idle-bus-engine-idling-408780.mp3");engineAudio.loop=true;engineAudio.preload="auto";engineAudio.volume=.32;function stopEngineAudio(){engineAudio.pause();engineAudio.currentTime=0;}function startEngineAudio(){engineAudio.play().catch(()=>{});}
sections.forEach((section,index)=>{const b=document.createElement("button");b.className="spot";b.textContent=(index+1)+". "+section.title;b.style.left=section.x+"%";b.style.top=section.y+"%";b.addEventListener("click",()=>openSection(index));spots.appendChild(b)});
function openSection(i){stopSim();activeSection=i;pressure=0;mode="idle";lastFocus=document.activeElement;const s=sections[i];document.getElementById("detailTitle").textContent=s.title;document.getElementById("summary").textContent=s.summary;const diagram=document.getElementById("diagramParts"),components=document.getElementById("components"),explain=document.getElementById("explain");diagram.replaceChildren();components.replaceChildren();if(i===0){diagram.innerHTML=airGenIllustration;const art=diagram.querySelector(".airgen-art");art.classList.toggle("engine-running",engineOn);art.querySelectorAll(".hot").forEach(node=>{const select=()=>{const n=Number(node.dataset.part);const b=components.children[n];if(b)b.click()};node.addEventListener("click",select);node.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select()}})})}s.parts.forEach(([name,description],j)=>{if(j&&i!==0){const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="→";diagram.appendChild(arrow)}const node=document.createElement("div");node.className="part";node.textContent=name;if(i!==0)diagram.appendChild(node);const button=document.createElement("button");button.className="component";button.textContent=name;button.onclick=()=>{components.querySelectorAll(".component").forEach(el=>el.classList.remove("active"));button.classList.add("active");if(i===0){diagram.querySelectorAll(".hot").forEach((n,k)=>n.classList.toggle("active",k===j))}explain.textContent=description};components.appendChild(button)});components.firstChild.click();buildSim(i);dialog.classList.add("open");document.body.style.overflow="hidden";close.focus()}
function hide(){stopSim();engineOn=false;stopEngineAudio();dialog.classList.remove("open");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
close.onclick=hide;dialog.addEventListener("click",e=>{if(e.target===dialog)hide()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dialog.classList.contains("open"))hide()});

let purgeAudioContext=null;
function unlockPurgeAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!purgeAudioContext)purgeAudioContext=new AC();if(purgeAudioContext.state==="suspended")purgeAudioContext.resume().catch(()=>{});}catch(e){}}
function playGovernorPurge(){const art=document.getElementById("airgenArt");if(art){art.classList.add("purging");setTimeout(()=>art.classList.remove("purging"),1800)}unlockPurgeAudio();const ctx=purgeAudioContext;if(!ctx)return;const run=()=>{try{const duration=1.8,rate=ctx.sampleRate,buffer=ctx.createBuffer(1,Math.floor(rate*duration),rate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const source=ctx.createBufferSource();source.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=3200;const gain=ctx.createGain(),now=ctx.currentTime;gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.85,now+.04);gain.gain.exponentialRampToValueAtTime(.40,now+.45);gain.gain.exponentialRampToValueAtTime(.001,now+duration);source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start(now);source.stop(now+duration);}catch(e){console.warn("Governor purge sound unavailable",e)}};if(ctx.state==="running")run();else ctx.resume().then(run).catch(()=>{})}
function stopSim(){if(simTimer){clearInterval(simTimer);simTimer=null}}
function updateSim(message){document.getElementById("needle").setAttribute("transform","rotate("+(-130+Math.min(150,pressure)/150*260)+" 100 100)");document.getElementById("simMode").textContent=mode==="charge"?"Compressor charging":mode==="apply"?"Service brakes applied":mode==="release"?"Releasing air":"Ready";}
function action(label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=fn;document.getElementById("simControls").appendChild(b)}
function animate(target,step,onDone){stopSim();simTimer=setInterval(()=>{pressure=Math.max(0,Math.min(150,pressure+step));updateSim();if((step>0&&pressure>=target)||(step<0&&pressure<=target)){pressure=target;stopSim();mode="idle";updateSim(onDone);if(engineOn&&step>0&&target===125&&dialog.classList.contains("open"))playGovernorPurge()}},65)}
function ignition(){unlockPurgeAudio();engineOn=!engineOn;const art=document.getElementById("airgenArt");if(art)art.classList.toggle("engine-running",engineOn);if(engineOn)startEngineAudio();else stopEngineAudio();const key=document.getElementById("ignitionKey");key.setAttribute("aria-pressed",String(engineOn));key.setAttribute("aria-label",engineOn?"Turn ignition off":"Turn ignition on");key.querySelector(".ignition-key").classList.toggle("on",engineOn);document.getElementById("ignitionState").textContent=engineOn?"ON":"OFF";if(engineOn){mode="charge";animate(125,1,"Governor cut-out near 125 PSI (illustrative setting).")}else{stopSim();mode="idle";updateSim("Engine off. Stored air remains available until used or lost.")}}
function buildSim(i){
 stopSim();stopEngineAudio();engineOn=false;pressure=80;mode="idle";
 const key=document.querySelector(".lab-ignition #ignitionKey");
 key.onclick=ignition;
 key.setAttribute("aria-pressed","false");
 key.setAttribute("aria-label","Turn ignition on");
 key.querySelector(".ignition-key").classList.remove("on");
 document.getElementById("ignitionState").textContent="OFF";
 updateSim();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopEngineAudio();else if(engineOn&&dialog.classList.contains("open"))startEngineAudio()});</script></body></html>
