<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081421"><title>Skills | Explore Air Brake System</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#081421;color:#fff;font-family:system-ui,Arial}
.viewport{width:100%;height:100vh;height:100dvh;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#081421}
.viewport::-webkit-scrollbar{display:none}
.track{height:100%;width:max-content;min-width:100%;display:flex;align-items:center;justify-content:center}
.bus{display:block;height:100%;width:auto;max-width:none;object-fit:contain;user-select:none;-webkit-user-drag:none}
.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:3;text-decoration:none;background:rgba(9,22,36,.86);color:#fff;border:1px solid #ffffff55;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;backdrop-filter:blur(8px)}
.hint{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:none;background:rgba(9,22,36,.82);padding:8px 14px;border-radius:999px;font-size:12px;color:#e5e9ee;white-space:nowrap}
@media(min-width:850px){.track{width:100%}.bus{width:100%;height:100%;object-fit:contain}.hint{display:none}}
@media(orientation:landscape){.hint{display:none}}

.track{position:relative}.spots{position:absolute;inset:0;pointer-events:none}.spot{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);border:1px solid #ffe1a0;background:rgba(12,27,43,.88);color:#fff;border-radius:999px;padding:9px 12px;font-weight:750;font-size:12px;box-shadow:0 0 0 5px #e5b45433;white-space:nowrap;cursor:pointer}.spot:focus-visible{outline:3px solid white}.spot:hover{background:#bd8b38}
.dialog{position:fixed;inset:0;z-index:10;background:rgba(2,9,17,.85);display:none;align-items:center;justify-content:center;padding:16px}.dialog.open{display:flex}.detail{width:min(760px,100%);max-height:92dvh;overflow:auto;background:#102338;border:1px solid #c99a50;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0009}.detail h2{margin:0 40px 5px 0}.detail p{color:#cbd8e6;line-height:1.5}.close{float:right;background:#263e54;color:#fff;border:1px solid #8294a7;border-radius:10px;padding:8px 12px;cursor:pointer}.illustration{margin:16px 0;background:linear-gradient(135deg,#203e53,#071523);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:175px}.diagram-parts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px}.part{border:2px solid #e3b85d;background:#203f55;padding:14px 12px;border-radius:12px;text-align:center;min-width:105px;font-size:13px;font-weight:700}.arrow{color:#f5cb77;font-size:23px}.components{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.component{background:#1d374b;border:1px solid #526e81;color:#fff;padding:12px;border-radius:10px;text-align:left;cursor:pointer}.component.active{border-color:#ffd279;background:#39506a}.explain{min-height:70px;padding:14px;border-radius:10px;background:#071a2a;margin-top:12px;line-height:1.5;color:#d9e7f3}
@media(max-width:550px){.spot{font-size:11px;padding:8px 10px}.detail{padding:14px}.components{grid-template-columns:1fr 1fr}.part{min-width:80px;padding:10px 7px;font-size:11px}}
</style></head><body><a class="back" href="./">← Cockpit</a><main class="viewport" aria-label="Swipe horizontally to explore the school bus air brake model"><div class="track"><img class="bus" src="air-brake-bus-background.png" alt="Conceptual school bus cutaway showing air brake components" draggable="false"><div class="spots" id="spots"></div></div></main><div class="hint">← Swipe to explore the bus →</div><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><section class="detail"><button class="close" id="close" aria-label="Close section">✕ Close</button><h2 id="detailTitle"></h2><p id="summary"></p><div class="illustration"><div class="diagram-parts" id="diagramParts"></div></div><div class="components" id="components"></div><div class="explain" id="explain">Select a component to learn about it.</div><p style="font-size:12px">Simplified instructional diagram. Exact locations and plumbing depend on the bus chassis and must be checked against manufacturer documentation.</p></section></div>
<script>
const sections=[
{title:"Air Generation",x:78,y:64,summary:"How the engine-driven compressor produces and conditions compressed air.",parts:[["Compressor","Pumps air into the system while the engine runs."],["Governor","Controls compressor loading and unloading at the specified pressure range."],["Air dryer","Removes moisture and contaminants from compressed air."],["Safety valve","Protects the supply side against excessive pressure."]]},
{title:"Air Storage",x:58,y:73,summary:"How compressed air is stored and kept available in separate circuits.",parts:[["Supply reservoir","Receives conditioned compressed air before it is distributed to service reservoirs."],["Primary reservoir","Stores air for one service brake circuit."],["Secondary reservoir","Stores air for the other service brake circuit."],["Check valves","Help prevent air from flowing backward and protect circuit independence."],["Drain valves","Allow accumulated moisture and oil to be drained from reservoirs."]]},
{title:"Service Air",x:41,y:57,summary:"How pedal input controls air pressure delivered to service brakes.",parts:[["Dual foot valve","Meters air from two separate circuits when the driver presses the brake pedal."],["Service air lines","Carry control or delivery air to braking components."],["Relay valve","Uses a control signal to deliver reservoir air rapidly to nearby brake chambers, where fitted."],["Service chamber","Converts applied air pressure into mechanical pushrod force."]]},
{title:"Front Air Brakes",x:83,y:83,summary:"How compressed air applies and releases the front service brakes.",parts:[["Front service chamber","Uses compressed air to move a pushrod for front service braking."],["Air delivery","Delivers controlled pressure to the front service chambers."],["Air release","Exhausts service air when the brake pedal is released."]]},
{title:"Rear & Parking",x:22,y:79,summary:"How rear service braking and spring-applied parking brakes operate.",parts:[["Rear service chamber","Uses air pressure for normal service braking."],["Spring brake chamber","Contains a powerful spring that applies parking braking when release air is exhausted."],["Parking control valve","Commands release or application of the spring parking brakes."],["Spring brake relay valve","Controls spring brake air delivery and exhaust on systems equipped with one."]]}
];
const spots=document.getElementById("spots"),dialog=document.getElementById("dialog"),close=document.getElementById("close");let lastFocus=null;
sections.forEach((section,index)=>{const b=document.createElement("button");b.className="spot";b.textContent=(index+1)+". "+section.title;b.style.left=section.x+"%";b.style.top=section.y+"%";b.addEventListener("click",()=>openSection(index));spots.appendChild(b)});
function openSection(i){lastFocus=document.activeElement;const s=sections[i];document.getElementById("detailTitle").textContent=s.title;document.getElementById("summary").textContent=s.summary;const diagram=document.getElementById("diagramParts"),components=document.getElementById("components"),explain=document.getElementById("explain");diagram.replaceChildren();components.replaceChildren();s.parts.forEach(([name,description],j)=>{if(j){const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="→";diagram.appendChild(arrow)}const node=document.createElement("div");node.className="part";node.textContent=name;diagram.appendChild(node);const button=document.createElement("button");button.className="component";button.textContent=name;button.onclick=()=>{components.querySelectorAll(".component").forEach(el=>el.classList.remove("active"));button.classList.add("active");explain.textContent=description};components.appendChild(button)});components.firstChild.click();dialog.classList.add("open");document.body.style.overflow="hidden";close.focus()}
function hide(){dialog.classList.remove("open");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
close.onclick=hide;dialog.addEventListener("click",e=>{if(e.target===dialog)hide()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dialog.classList.contains("open"))hide()});
</script></body></html>
