<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081421"><title>Skills | Explore Air Brake System</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#081421;color:#fff;font-family:system-ui,Arial}
.viewport{width:100%;height:100vh;height:100dvh;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#081421}
.viewport::-webkit-scrollbar{display:none}
.track{height:100%;width:max-content;min-width:100%;display:flex;align-items:center;justify-content:center}
.bus{display:block;height:100%;width:auto;max-width:none;object-fit:contain;user-select:none;-webkit-user-drag:none}
.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:3;text-decoration:none;background:rgba(9,22,36,.86);color:#fff;border:1px solid #ffffff55;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;backdrop-filter:blur(8px)}
.hint{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:none;background:rgba(9,22,36,.82);padding:8px 14px;border-radius:999px;font-size:12px;color:#e5e9ee;white-space:nowrap}
@media(min-width:850px){.track{width:100%}.bus{width:100%;height:100%;object-fit:contain}.hint{display:none}}
@media(orientation:landscape){.hint{display:none}}

.track{position:relative}.spots{position:absolute;inset:0;pointer-events:none}.spot{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);border:1px solid #ffe1a0;background:rgba(12,27,43,.88);color:#fff;border-radius:999px;padding:9px 12px;font-weight:750;font-size:12px;box-shadow:0 0 0 5px #e5b45433;white-space:nowrap;cursor:pointer}.spot:focus-visible{outline:3px solid white}.spot:hover{background:#bd8b38}
.dialog{position:fixed;inset:0;z-index:10;background:rgba(2,9,17,.85);display:none;align-items:center;justify-content:center;padding:16px}.dialog.open{display:flex}.detail{width:min(760px,100%);max-height:92dvh;overflow:auto;background:#102338;border:1px solid #c99a50;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0009}.detail h2{margin:0 40px 5px 0}.detail p{color:#cbd8e6;line-height:1.5}.close{float:right;background:#263e54;color:#fff;border:1px solid #8294a7;border-radius:10px;padding:8px 12px;cursor:pointer}.illustration{margin:16px 0;background:linear-gradient(135deg,#203e53,#071523);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:175px}.diagram-parts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px}.part{border:2px solid #e3b85d;background:#203f55;padding:14px 12px;border-radius:12px;text-align:center;min-width:105px;font-size:13px;font-weight:700}.arrow{color:#f5cb77;font-size:23px}.components{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.component{background:#1d374b;border:1px solid #526e81;color:#fff;padding:12px;border-radius:10px;text-align:left;cursor:pointer}.component.active{border-color:#ffd279;background:#39506a}.explain{min-height:70px;padding:14px;border-radius:10px;background:#071a2a;margin-top:12px;line-height:1.5;color:#d9e7f3}
@media(max-width:550px){.spot{font-size:11px;padding:8px 10px}.detail{padding:14px}.components{grid-template-columns:1fr 1fr}.part{min-width:80px;padding:10px 7px;font-size:11px}}
.sim{background:linear-gradient(145deg,#142e42,#081726);border:1px solid #4d7186;border-radius:14px;padding:15px;margin:12px 0}.sim-top{display:flex;align-items:center;justify-content:space-around;gap:12px;flex-wrap:wrap}.gauge{width:145px;height:145px;position:relative}.gauge svg{width:100%;height:100%}.psi{font-size:24px;font-weight:800;text-align:center}.sim button{border:1px solid #dfb96e;border-radius:10px;background:#304d61;color:#fff;padding:10px 13px;font-weight:700;cursor:pointer}.sim-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.status{text-align:center;color:#d7e5f0;font-size:13px;min-height:22px;margin-top:10px}.sim-flow{height:13px;border-radius:12px;background:#263b4b;margin:14px 0;overflow:hidden}.sim-flow>div{height:100%;width:35%;background:repeating-linear-gradient(90deg,#e6b65e 0 12px,#70c6e6 12px 24px);animation:airmove .7s linear infinite;opacity:.2}.sim-flow.running>div{opacity:1}@keyframes airmove{to{transform:translateX(180%)}}@media(prefers-reduced-motion:reduce){.sim-flow>div{animation:none}}
</style></head><body><a class="back" href="./">← Cockpit</a><main class="viewport" aria-label="Swipe horizontally to explore the school bus air brake model"><div class="track"><img class="bus" src="air-brake-bus-background.png" alt="Conceptual school bus cutaway showing air brake components" draggable="false"><div class="spots" id="spots"></div></div></main><div class="hint">← Swipe to explore the bus →</div><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><section class="detail"><button class="close" id="close" aria-label="Close section">✕ Close</button><h2 id="detailTitle"></h2><p id="summary"></p><div class="sim" id="sim"><div class="sim-top"><div class="gauge"><svg viewBox="0 0 160 160" aria-label="Air pressure gauge"><circle cx="80" cy="80" r="66" fill="#091723" stroke="#68859a" stroke-width="7"/><path d="M 27 120 A 65 65 0 1 1 133 120" fill="none" stroke="#e8bd6b" stroke-width="5"/><g id="ticks"></g><g id="needle" transform="rotate(-130 80 80)"><line x1="80" y1="80" x2="80" y2="28" stroke="#ffcc6b" stroke-width="4" stroke-linecap="round"/></g><circle cx="80" cy="80" r="6" fill="#fff"/><text x="80" y="113" text-anchor="middle" fill="white" font-size="17" id="psiText">0 PSI</text></svg></div><div><div style="font-weight:750">System air pressure</div><div id="simMode" style="font-size:13px;color:#c3d6e5;margin-top:8px">Ready</div></div></div><div class="sim-flow" id="simFlow"><div></div></div><div class="sim-controls" id="simControls"></div><div class="status" id="simStatus"></div></div><div class="illustration"><div class="diagram-parts" id="diagramParts"></div></div><div class="components" id="components"></div><div class="explain" id="explain">Select a component to learn about it.</div><p style="font-size:12px">Simplified instructional diagram. Exact locations and plumbing depend on the bus chassis and must be checked against manufacturer documentation.</p></section></div>
<script>
const sections=[
{title:"Air Generation",x:24,y:63,summary:"How the engine-driven compressor produces and conditions compressed air.",parts:[["Compressor","Pumps air into the system while the engine runs."],["Governor","Controls compressor loading and unloading at the specified pressure range."],["Air dryer","Removes moisture and contaminants from compressed air."],["Safety valve","Protects the supply side against excessive pressure."]]},
{title:"Air Storage",x:55,y:73,summary:"How compressed air is stored and kept available in separate circuits.",parts:[["Supply reservoir","Receives conditioned compressed air before it is distributed to service reservoirs."],["Primary reservoir","Stores air for one service brake circuit."],["Secondary reservoir","Stores air for the other service brake circuit."],["Check valves","Help prevent air from flowing backward and protect circuit independence."],["Drain valves","Allow accumulated moisture and oil to be drained from reservoirs."]]},
{title:"Service Brake Controls",x:31,y:47,summary:"The dual foot valve is operated from the driver’s pedal area; service air then travels through lines and valves to brake chambers at the axles.",parts:[["Dual foot valve","Meters air from two separate circuits when the driver presses the brake pedal."],["Service air lines","Carry control or delivery air to braking components."],["Relay valve","Uses a control signal to deliver reservoir air rapidly to nearby brake chambers, where fitted."],["Service chamber","Converts applied air pressure into mechanical pushrod force."]]},
{title:"Front Air Brakes",x:18,y:83,summary:"How compressed air applies and releases the front service brakes.",parts:[["Front service chamber","Uses compressed air to move a pushrod for front service braking."],["Air delivery","Delivers controlled pressure to the front service chambers."],["Air release","Exhausts service air when the brake pedal is released."]]},
{title:"Rear & Parking",x:83,y:82,summary:"How rear service braking and spring-applied parking brakes operate.",parts:[["Rear service chamber","Uses air pressure for normal service braking."],["Spring brake chamber","Contains a powerful spring that applies parking braking when release air is exhausted."],["Parking control valve","Commands release or application of the spring parking brakes."],["Spring brake relay valve","Controls spring brake air delivery and exhaust on systems equipped with one."]]}
];
const spots=document.getElementById("spots"),dialog=document.getElementById("dialog"),close=document.getElementById("close");let lastFocus=null,simTimer=null,pressure=0,mode="idle",activeSection=0;
sections.forEach((section,index)=>{const b=document.createElement("button");b.className="spot";b.textContent=(index+1)+". "+section.title;b.style.left=section.x+"%";b.style.top=section.y+"%";b.addEventListener("click",()=>openSection(index));spots.appendChild(b)});
function openSection(i){stopSim();activeSection=i;pressure=0;mode="idle";lastFocus=document.activeElement;const s=sections[i];document.getElementById("detailTitle").textContent=s.title;document.getElementById("summary").textContent=s.summary;const diagram=document.getElementById("diagramParts"),components=document.getElementById("components"),explain=document.getElementById("explain");diagram.replaceChildren();components.replaceChildren();s.parts.forEach(([name,description],j)=>{if(j){const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="→";diagram.appendChild(arrow)}const node=document.createElement("div");node.className="part";node.textContent=name;diagram.appendChild(node);const button=document.createElement("button");button.className="component";button.textContent=name;button.onclick=()=>{components.querySelectorAll(".component").forEach(el=>el.classList.remove("active"));button.classList.add("active");explain.textContent=description};components.appendChild(button)});components.firstChild.click();buildSim(i);dialog.classList.add("open");document.body.style.overflow="hidden";close.focus()}
function hide(){stopSim();dialog.classList.remove("open");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
close.onclick=hide;dialog.addEventListener("click",e=>{if(e.target===dialog)hide()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dialog.classList.contains("open"))hide()});

const ticks=document.getElementById("ticks");for(let n=0;n<=6;n++){const a=(-130+n*260/6)*Math.PI/180;const x=80+56*Math.sin(a),y=80-56*Math.cos(a),x2=80+62*Math.sin(a),y2=80-62*Math.cos(a);const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke","#e2edf5");l.setAttribute("stroke-width","2");ticks.appendChild(l)}
function stopSim(){if(simTimer){clearInterval(simTimer);simTimer=null}}
function updateSim(message){document.getElementById("needle").setAttribute("transform","rotate("+(-130+Math.min(150,pressure)/150*260)+" 80 80)");document.getElementById("psiText").textContent=Math.round(pressure)+" PSI";document.getElementById("simMode").textContent=mode==="charge"?"Compressor charging":mode==="apply"?"Service brakes applied":mode==="release"?"Releasing air":"Ready";document.getElementById("simStatus").textContent=message||"";document.getElementById("simFlow").classList.toggle("running",mode==="charge"||mode==="apply")}
function action(label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=fn;document.getElementById("simControls").appendChild(b)}
function animate(target,step,onDone){stopSim();simTimer=setInterval(()=>{pressure=Math.max(0,Math.min(150,pressure+step));updateSim();if((step>0&&pressure>=target)||(step<0&&pressure<=target)){pressure=target;stopSim();mode="idle";updateSim(onDone)}},65)}
function buildSim(i){const c=document.getElementById("simControls");c.replaceChildren();pressure=i===0?80:110;mode="idle";if(i===0){action("Start compressor",()=>{mode="charge";animate(125,1,"Governor cut-out: compressor unloads at 125 PSI (illustrative setting).")});action("Simulate cut-in",()=>{stopSim();pressure=100;mode="idle";updateSim("Governor cut-in around 100 PSI; press Start compressor.")});action("Reset",()=>{stopSim();pressure=80;mode="idle";updateSim("Ready to build air pressure.")});updateSim("Start the compressor to build pressure.")}else if(i===1){action("Fill reservoirs",()=>{mode="charge";animate(125,1,"Reservoirs charged. Dual circuits are represented conceptually.")});action("Drain air",()=>{mode="release";animate(0,-2,"Air exhausted from the simulated reservoir.")});updateSim("Charge or drain the simulated reservoir.")}else if(i===2||i===3||i===4){action("Apply service brakes",()=>{stopSim();pressure=85;mode="apply";updateSim("Service air delivered to brake chambers.")});action("Release service brakes",()=>{mode="release";animate(0,-3,"Service chamber air exhausted; brakes released.")});if(i===4){action("Apply parking brake",()=>{stopSim();pressure=0;mode="idle";updateSim("Spring brake release air exhausted; spring parking brakes apply.")});action("Release parking brake",()=>{stopSim();pressure=110;mode="idle";updateSim("Sufficient release air holds the spring brakes off (conceptual).")})}updateSim("Use the controls to explore brake air pressure.")}}
</script></body></html>
